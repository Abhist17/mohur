name: Deploy the Tenbin app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Build static site (Base Sepolia, reads via Anon-RPC)
        working-directory: web
        env:
          STATIC_EXPORT: "1"
          BASE_PATH: /tenbin
          NEXT_PUBLIC_TENBIN_NETWORK: base-sepolia
          NEXT_PUBLIC_TENBIN_WORKER: nym
          NEXT_DIST_DIR: site
        run: npm run build && touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
